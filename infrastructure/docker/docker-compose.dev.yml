version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_secret_11}
      POSTGRES_DB: ${POSTGRES_DB:-trading_engine_db}
    ports:
      - "5440:5432"

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: always
    ports:
      - "6387:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: trading_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8008:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-trading_secret_11}@postgres:5432/${POSTGRES_DB:-trading_engine_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: trading_frontend
    restart: always
    ports:
      - "3008:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8008/api/v1
    depends_on:
      - backend
